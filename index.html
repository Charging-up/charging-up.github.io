<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Doge 的个人写作页面">
  <title>Doge｜随便写写</title>

  <style>
    :root {
      --burgundy: #76002f;
      --link: #17177a;
      --rule: #a5183f;
      --paper: #fff;
      --ink: #111;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--burgundy);
      color: var(--ink);
      font-family: "Noto Serif SC", "Songti SC", SimSun, serif;
      font-size: 18px;
      line-height: 1.8;
    }

    a {
      color: var(--link);
      text-decoration: none;
    }

    a:hover,
    a:focus-visible {
      color: var(--burgundy);
      text-decoration: underline;
    }

    .site-label {
      width: min(1140px, calc(100% - 40px));
      margin: 0 auto;
      padding: 16px 2px 12px;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .page {
      width: min(1140px, calc(100% - 40px));
      min-height: calc(100vh - 76px);
      margin: 0 auto 34px;
      padding: 40px 42px 64px;
      background: var(--paper);
      border: 4px double #8a8a8a;
    }

    .intro {
      display: grid;
      grid-template-columns: minmax(220px, 0.8fr) minmax(360px, 1.45fr);
      gap: 56px;
      align-items: start;
      padding: 2px 7% 38px;
      border-bottom: 1px solid var(--rule);
    }

    .profile {
      text-align: center;
    }

    .profile h1 {
      margin: 0 0 22px;
      font-size: clamp(34px, 4vw, 48px);
      line-height: 1.2;
      letter-spacing: 0.04em;
    }

    .portrait {
      display: block;
      width: min(100%, 260px);
      aspect-ratio: 3 / 4;
      margin: 0 auto;
      border: 1px solid #777;
      object-fit: cover;
      object-position: center top;
    }

    .contents {
      padding-top: 4px;
    }

    .contents h2 {
      margin: 0 0 28px;
      text-align: center;
      font-size: clamp(25px, 3vw, 32px);
      line-height: 1.3;
    }

    .contents ul {
      width: fit-content;
      margin: 0 auto;
      padding: 0;
      list-style: none;
    }

    .contents li {
      position: relative;
      margin: 18px 0;
      padding-left: 28px;
      font-size: 20px;
    }

    .contents li::before {
      position: absolute;
      left: 0;
      content: "➢";
      color: #222;
    }

    .writing-section {
      min-height: 210px;
      padding: 64px 8% 42px;
      text-align: center;
      scroll-margin-top: 24px;
    }

    .writing-section + .writing-section {
      border-top: 1px solid #d8a7b5;
    }

    .writing-section h2 {
      margin: 0;
      color: #d00000;
      font-size: clamp(26px, 3vw, 34px);
      letter-spacing: 0.05em;
    }

    .empty-space {
      min-height: 90px;
    }

    footer {
      margin-top: 24px;
      color: #555;
      font-size: 13px;
      text-align: center;
    }

    @media (max-width: 760px) {
      body {
        font-size: 16px;
      }

      .site-label,
      .page {
        width: calc(100% - 22px);
      }

      .site-label {
        padding-top: 10px;
      }

      .page {
        margin-bottom: 11px;
        padding: 30px 20px 44px;
      }

      .intro {
        grid-template-columns: 1fr;
        gap: 38px;
        padding: 0 0 34px;
      }

      .portrait {
        width: min(72vw, 240px);
      }

      .contents li {
        font-size: 18px;
      }

      .writing-section {
        min-height: 175px;
        padding: 50px 4% 30px;
      }
    }
  </style>
</head>

<body>
  <div class="site-label">Doge：随便写写</div>

  <main class="page">
    <section class="intro" aria-label="个人简介与目录">
      <div class="profile">
        <h1>Doge</h1>
        <img class="portrait" src="img.jpg" alt="Doge 的人像">
      </div>

      <nav class="contents" aria-labelledby="contents-title">
        <h2 id="contents-title">随便写写</h2>
        <ul>
          <li><a href="#memories">往事回忆</a></li>
          <li><a href="#writings">随便写写</a></li>
        </ul>
      </nav>
    </section>

    <section class="writing-section" id="memories">
      <h2>往事回忆</h2>
      <div class="empty-space" aria-hidden="true"></div>
    </section>

    <section class="writing-section" id="writings">
      <h2>随便写写</h2>
      <div class="empty-space" aria-hidden="true"></div>
    </section>

    <footer>© Doge</footer>
  </main>
</body>
</html>
