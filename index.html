<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>我的生活记录</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f5f2;
      color: #333;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft YaHei",
        sans-serif;
      line-height: 1.8;
    }

    header {
      padding: 70px 20px;
      background: white;
      text-align: center;
      border-bottom: 1px solid #e5e5e5;
    }

    header h1 {
      margin: 0 0 12px;
      font-size: 38px;
    }

    header p {
      margin: 0;
      color: #777;
    }

    main {
      width: min(760px, calc(100% - 32px));
      margin: 40px auto;
    }

    article {
      margin-bottom: 30px;
      padding: 30px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 3px 15px rgba(0, 0, 0, 0.05);
    }

    article h2 {
      margin-top: 0;
    }

    time {
      display: block;
      margin-bottom: 18px;
      color: #888;
      font-size: 14px;
    }

    article img {
      display: block;
      width: 100%;
      height: auto;
      margin: 22px 0;
      border-radius: 8px;
    }

    footer {
      padding: 30px 20px;
      color: #888;
      text-align: center;
    }
  </style>
</head>

<body>
  <header>
    <h1>我的生活记录</h1>
    <p>记录生活、照片和偶尔出现的想法</p>
  </header>

  <main>
    <article>
      <h2>网站开张了</h2>
      <time datetime="2026-07-27">2026年7月27日</time>

      <p>
        这是我的第一篇生活记录。
        我准备在这里保存日常经历、照片以及一些随手写下的想法。
      </p>

      <p>
        以后再回头阅读，也许会发现很多当时没有注意到的细节。
      </p>
    </article>

    <article>
      <h2>第二篇记录</h2>
      <time datetime="2026-07-28">2026年7月28日</time>

      <p>
        这里可以继续写另一篇内容。
        每一篇记录都放在一个 article 标签中。
      </p>
    </article>
  </main>

  <footer>
    © 2026 我的生活记录
  </footer>
</body>
</html>
